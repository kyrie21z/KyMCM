interface:
  display_name: "KyMCM Lite"
  short_description: "Non-visual modeling with incremental supplements"
  default_prompt: "Use $kymcm-lite for non-visual modeling; execute each base or Supplement unit through RESULT plus its machine check, stop and wait for explicit user/ChatGPT semantic acceptance, and create or refresh the one question-level HANDOFF only in a new independent read-only HANDOFF task after acceptance. Apply the same gate to PRE/RESULT_PRE. For explicitly requested final-figure instructions or review after accepted RESULT and current HANDOFF, read final_figure_core_rules.md. For Codex/Matplotlib data-driven figures or general data-figure specifications, first read final_figure_selection.md and choose L0/L1/L2/L3 from a real enhancement trigger; then read final_figure_style.md, final_figure_color.md, and final_figure_typography.md before calling external nature-figure. Transfer the frozen physical-size, PDF/PNG, geometry, palette, batlow/vik, accessibility, and exact Noto Serif CJK SC / Tinos / STIX mathtext contracts; missing fonts stop formal rendering."
