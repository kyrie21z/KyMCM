name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_lite_figure_exec -v
      - run: python -m unittest discover -s tests/lite -v
      - run: python -m unittest tests.test_lite_cli tests.test_lite_portability tests.test_lite_v3_phase1 -v
      - run: python -m unittest tests.test_lite_release -v
      - run: python -m unittest discover -s tests/full -v
      - run: python -m unittest tests.test_full_cli tests.test_full_portability tests.test_figure_system tests.test_markdown_format tests.test_release_tree -v
      - run: python -m compileall skills/kymcm-full skills/kymcm-lite tests
