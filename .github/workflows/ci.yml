name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Prepare real submission-build tools
        if: matrix.python-version == '3.12'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ texlive-xetex texlive-lang-chinese texlive-fonts-recommended
          command -v xelatex
          command -v g++
          kpsewhich ctexart.cls
          kpsewhich FandolSong-Regular.otf
          python -m unittest tests.test_lite_ai_tool_usage_template.LiteAIUsageLatexBuildTests.test_two_three_five_images_and_resolved_references tests.lite.test_appendix_runtime.AppendixRuntimeTests.test_native_relative_package_really_builds_and_runs -v
      - name: Discover all tests
        run: python -m unittest discover -s tests -v
      - run: python scripts/export_kymcm_lite_full_spec.py --check
      - run: python -m compileall -q scripts skills/kymcm-full skills/kymcm-lite tests

  figure3d:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYVISTA_OFF_SCREEN: "true"
      VTK_DEFAULT_OPENGL_WINDOW: "vtkEGLRenderWindow"
      KYMCM_RUN_PYVISTA_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r skills/kymcm-lite/requirements-figure-3d.txt
      - run: python -m unittest tests.test_lite_figure_bundle -v
      - run: python -m unittest tests.test_lite_figure_3d -v
